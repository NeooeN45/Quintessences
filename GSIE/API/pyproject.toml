[project]
name = "gsie-api"
version = "0.1.0"
description = "GSIE API — General System Intelligence Engine REST/WebSocket API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Camille Perraudeau" }]

# Dépendances épinglées — versions publiées > 7 jours (règle global_rules)
dependencies = [
    # Framework API
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "gunicorn==23.0.0",
    # Validation
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "geojson-pydantic==1.1.2",
    # Base de données
    "asyncpg==0.30.0",
    "sqlalchemy[asyncio]==2.0.36",
    "geoalchemy2==0.16.0",
    "alembic==1.14.0",
    # Cache & temps réel
    "redis[hiredis]==5.2.1",
    "websockets==14.1",
    # Géospatial — shapely/pyproj dès la semaine 1 (léger)
    # rasterio + geopandas ajoutés en semaine 5 (GIS Engine, nécessite GDAL)
    "shapely==2.0.6",
    "pyproj==3.7.0",
    # Observabilité
    "structlog==24.4.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-instrumentation-sqlalchemy==0.50b0",
    "opentelemetry-instrumentation-redis==0.50b0",
    "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
    # Auth — bcrypt direct (passlib 1.7.4 non maintenu, CVE potentielles)
    "pyjwt[crypto]==2.10.1",
    "bcrypt==5.0.0",
    # Sécurité — chiffrement .env (audit P1-1, tools/secure_env.py + core/config.py)
    # cryptography est tiré par pyjwt[crypto] mais importé directement → déclarer
    "cryptography==49.0.0",
    # Sécurité — rate limiting (OWASP A07)
    "slowapi==0.1.9",
    # OGC API — pygeoapi ajouté en semaine 5 (GIS Engine)
    # Note : pygeoapi 0.19 exige pydantic<2.0, incompatible avec pydantic v2
    # Solution : fastgeoapi (P1) ou wrapper Starlette custom (P0)
    # Statistiques — Correlation Engine (Pearson/Spearman + p-valeur)
    "scipy==1.15.3",
    # Décodage GRIB2 — Climate Engine, modèle AROME (WCS Météo-France)
    # eccodes embarque les binaires dans la wheel Windows (vérifié
    # réel le 2026-07-18, pas de compilation/conda nécessaire)
    "eccodes==2.47.0",
    "cfgrib==0.9.15.1",
    "xarray==2026.4.0",
    "defusedxml==0.7.1",
    # Utilitaires
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    # Retries avec backoff exponentiel — clients API externes (GSIE-PROMPT-0023)
    "tenacity==8.5.0",
    # Sérialisation JSON haute performance (veille techno 2026-08-02)
    "orjson==3.10.11",
    # Boucle d'événements haute performance (Linux uniquement, veille techno 2026-08-02)
    "uvloop==0.21.0 ; sys_platform != 'win32'",
    "eccodeslib==2.47.3.23 ; sys_platform != 'win32'",
    "pgvector==0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    # Parallélisation de la suite pytest (P2-1) — version stable, publiée
    # depuis plusieurs mois, compatible pytest 8.3.x
    "pytest-xdist==3.6.1",
    "testcontainers[postgres]==4.10.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    # SQLite async pour tests unitaires service.py (sans Docker/PostgreSQL)
    "aiosqlite==0.20.0",
    # Mocking strict des appels HTTP dans les tests d'integration.
    "respx==0.22.0",
    # redis 5.x+ ships its own py.typed stubs; types-redis is obsolete and conflicts
    # "types-redis" must not be added here.
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsie_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_functions = ["should_*", "test_*"]
# pytest-xdist activé par défaut avec --dist=loadfile : chaque fichier de test
# s'exécute dans son propre processus worker, ce qui isole les fuites d'état
# (registre SQLAlchemy déclaratif, event loop asyncio fermée) qui polluent
# la suite séquentielle (14 échecs + segfault Pydantic sur Windows quand le
# processus dépasse ~1600 tests). La fuite d'event loop est aussi atténuée
# par la fixture autouse `_ensure_fresh_event_loop` dans conftest.py.
# `-n auto` et non un nombre en dur : le plafond sûr dépend de la machine.
# Deux workers sont le maximum sur le poste de développement Windows (huit
# saturent le page file à cause de scipy/xarray/cfgrib), mais ce plafond n'a
# aucune raison de brider une CI Linux — ni de tenir sur une machine plus
# contrainte. Il se règle par `PYTEST_XDIST_AUTO_NUM_WORKERS`, que xdist lit
# pour résoudre `auto`. Voir docs/TESTING_XDIST.md.
addopts = "-v --tb=short -n auto --dist=loadfile --cov=gsie_api --cov-report=term-missing"
markers = [
    "serial: tests à exécuter en série (pas de parallélisation) — concurrence DB réelle",
    "xdist_group(name): groupe de tests à exécuter sur le même worker xdist",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]  # Migrations : lignes longues inévitables
"src/gsie_api/seeds/*_data.py" = ["E501"]  # Données de référence : descriptions longues

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Module Rust PyO3 — wheel gsie_evidence non installée en CI lint (job python-quality)
# Installée uniquement dans l'image Docker (Dockerfile builder stage)
[[tool.mypy.overrides]]
module = "gsie_evidence"
ignore_missing_imports = true

# shapely n'a pas de stubs officiels installés (types-shapely existe mais
# n'est pas encore ajouté aux dépendances dev) — GIS Engine (v1)
[[tool.mypy.overrides]]
module = "shapely.*"
ignore_missing_imports = true

# cfgrib/defusedxml n'ont pas de stubs officiels installés — Climate
# Engine, decodage GRIB2 AROME
[[tool.mypy.overrides]]
module = ["cfgrib.*", "defusedxml.*"]
ignore_missing_imports = true

# scipy-stubs existe mais n'est pas encore ajouté aux dépendances dev —
# Correlation Engine (tests statistiques)
[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "psycopg2-binary==2.9.12",
]
