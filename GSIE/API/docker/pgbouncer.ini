# PgBouncer — pooler de connexions PostgreSQL (P0-2 pool sizing)
#
# Non déployé par défaut (service orphelin documenté — voir docker-compose.yml).
# À activer si le nombre de workers/replicas dépasse ce que le pool
# applicatif direct peut absorber sans épuiser max_connections PostgreSQL.
#
# Activation ADR requise : basculer db_pgbouncer_mode=True côté config.py
# (désactive les prepared statements asyncpg — statement_cache_size=0)
# et pointer GSIE_DATABASE_URL vers ce service (port 6432) au lieu de
# la connexion directe PostgreSQL (port 5432).
#
# auth_file (userlist.txt) : voir pgbouncer-userlist.txt (template — ne
# jamais committer de vrais hashs SCRAM).

[databases]
gsie = host=db port=5432 dbname=gsie pool_size=40 pool_mode=transaction

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
max_client_conn = 1000
default_pool_size = 40
reserve_pool_size = 10
reserve_pool_timeout = 3
server_idle_timeout = 600
