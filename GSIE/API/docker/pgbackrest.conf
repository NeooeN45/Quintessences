# pgBackRest — Configuration GSIE (audit DB 2026-07-27, DEC-000037)
#
# Cette configuration est un TEMPLATE — les secrets (cipher-pass, clés S3)
# doivent être injectés via un secret manager, jamais commités.
#
# Deux repositories :
#   repo1 = local (RTO court, restauration rapide)
#   repo2 = S3 cross-région (DR long terme, conformité)
#
# Voir : https://pgbackrest.org/configuration.html

[global]
# Processus parallèles (limite CPU/RAM pendant le backup)
process-max=4

# Compression zstd (rapide + bon ratio)
compress-type=zst
compress-level=6

# Démarrage rapide des backups (ne pas attendre le prochain checkpoint)
start-fast=y

# Archivage asynchrone des WAL (évite de ralentir les COMMIT)
archive-async=y
spool-path=/var/spool/pgbackrest

# Chiffrement AES-256-CBC des backups (at-rest). La passphrase n'est PAS
# fixée ici : pgbackrest.conf n'interprète pas `${VAR}` (ce n'est pas un
# fichier shell — une valeur littérale de ce type serait utilisée telle
# quelle comme passphrase). pgbackrest lit nativement la variable
# d'environnement PGBACKREST_REPO1_CIPHER_PASS du process qui l'invoque
# (voir PGBACKREST_REPO1_CIPHER_PASS dans docker-compose.yml / .env) —
# vérifié lors de la validation live du 2026-08-07.
repo1-cipher-type=aes-256-cbc

# Rétention : 4 full + 2 diff + incrémental illimité
repo1-retention-full=4
repo1-retention-full-type=count
repo1-retention-diff=2

# Repository 1 — local (RTO court)
repo1-type=posix
repo1-path=/var/lib/pgbackrest
repo1-bundle=y
repo1-block=y

# Repository 2 — S3 cross-région (DR long terme)
# Décommenter et configurer pour la production
# repo2-type=s3
# repo2-s3-bucket=gsie-pg-backups
# repo2-s3-endpoint=s3.eu-west-3.amazonaws.com
# repo2-s3-region=eu-west-3
# repo2-s3-key-type=auto
# repo2-cipher-type=aes-256-cbc
# repo2-cipher-pass lu depuis la variable d'environnement PGBACKREST_REPO2_CIPHER_PASS
# (ne pas écrire ${...} ici — voir la note sur repo1-cipher-pass ci-dessus)
# repo2-retention-full=12
# repo2-retention-full-type=count

[gsie]
# Chemin des données PostgreSQL — connexion via socket Unix local (le
# conteneur db exécute lui-même pgbackrest, jamais via SSH). `pg1-host`
# ne doit PAS être utilisé ici : cette option force un accès distant SSH
# et fait échouer stanza-create/backup en erreur [056] "unable to find
# primary cluster" (constaté lors de la validation live du 2026-08-07).
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
pg1-user=gsie
