global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    timeout connect 2s
    timeout client 35s
    timeout server 35s

resolvers docker_dns
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold nx 2s

frontend gsie_https
    bind :8443 ssl crt /certs/edge.pem alpn h2,http/1.1
    default_backend gsie_replicas

backend gsie_replicas
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    http-reuse safe
    retry-on conn-failure empty-response response-timeout 502 503 504
    http-response set-header X-GSIE-Backend %[srv_name]
    server replica_a api-ha-a:8000 check inter 500ms fastinter 200ms fall 2 rise 2 resolvers docker_dns init-addr last,libc,none
    server replica_b api-ha-b:8000 check inter 500ms fastinter 200ms fall 2 rise 2 resolvers docker_dns init-addr last,libc,none
