# GSIE — Outils de visualisation (Docker Compose)
# Veille VEILLE_OUTILS_VISUALISATION_DB_2026-07-31.md
#
# Stack recommandée (open source, self-hostable) :
#   - Metabase    : BI self-service (non-tech)       → http://localhost:3030
#   - Superset    : BI avancée (SQL Lab, 40+ charts) → http://localhost:8088
#   - Dekart      : Backend Kepler.gl (carto PostGIS) → http://localhost:8089
#
# Connexion PostgreSQL GSIE :
#   - Rejoint le réseau api_default (DB tourne dans api-db-1)
#   - Hostname de la DB : db (nom du service dans docker-compose.yml API)
#
# Ces outils exécutent du SQL arbitraire sur la base GSIE. Ils sont donc
# placés derrière le profil « viz » — `up -d` sans profil ne démarre plus
# rien (audit sécurité 2026-08-01, constat D : dekart démarrait
# implicitement, sans authentification, avec le compte propriétaire).
#
# Ils se connectent par `gsie_viz`, membre de `gsie_viz_lecture`
# (migration 20260801_0025) : SELECT seul, et **aucun** accès à
# `gsie_rgpd` ni `gsie_rgpd_identites`. Un outil de BI ne doit jamais
# pouvoir défaire le pseudonymat, quel que soit le SQL qu'on lui soumet.
#
# Usage :
#   docker compose -f docker-compose.viz.yml --profile viz up -d
#   docker compose -f docker-compose.viz.yml logs -f metabase
#   docker compose -f docker-compose.viz.yml --profile viz down
#
# Prérequis : .env dans GSIE/ avec GSIE_VIZ_DB_USER, GSIE_VIZ_DB_PASSWORD,
#             GSIE_DB_NAME + DB GSIE démarrée via GSIE/API/docker-compose.yml

services:

  # ──────────────────────────────────────────────────────────────────────
  # Metabase — BI self-service pour non-tech (forestiers, gestionnaires)
  # Port 3030 (évite conflit avec API 8000)
  # ──────────────────────────────────────────────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: gsie-metabase
    profiles: ["viz"]
    ports:
      - "127.0.0.1:3030:3000"
    environment:
      # MB_DB_* configure la base INTERNE de Metabase (comptes, mots de passe
      # hachés, identifiants des sources) — pas une source de données. Elle
      # pointait sur la base GSIE avec le compte propriétaire : Metabase y
      # créait sa centaine de tables dans `public`, et le contrôle de dérive
      # Alembic les aurait vues. On la laisse sur son volume H2 dédié.
      #
      # La source de données GSIE se configure depuis l'interface, avec
      # `gsie_viz` / GSIE_VIZ_DB_PASSWORD (lecture seule, hors RGPD).
      #
      # Sans cette clé, Metabase stocke en clair les identifiants de toutes
      # les sources qu'on lui déclare.
      MB_ENCRYPTION_SECRET_KEY: ${GSIE_METABASE_ENCRYPTION_KEY:?GSIE_METABASE_ENCRYPTION_KEY requis — openssl rand -base64 32}
      # Mémoire Java (Metabase est en Clojure/JVM)
      JAVA_TOOL_OPTIONS: "-Xmx512m"
      # Timezone
      MB_SITE_NAME: "GSIE Analytics"
    volumes:
      - gsie_metabase_data:/metabase.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  # ──────────────────────────────────────────────────────────────────────
  # Apache Superset — BI avancée (SQL Lab, 40+ chart types, dashboards)
  # Port 8088
  # ──────────────────────────────────────────────────────────────────────
  superset:
    image: apache/superset:latest
    container_name: gsie-superset
    profiles: ["viz"]
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      # Superset utilise sa propre DB interne (SQLite par défaut, OK pour dev)
      #
      # La valeur de repli littérale (`gsieSupersetDevKey2026`) était versionnée
      # et n'était réclamée nulle part : elle était donc le cas nominal. Elle
      # signe les cookies de session et chiffre les identifiants des sources —
      # la connaître suffisait à forger une session administrateur.
      SUPERSET_SECRET_KEY: ${GSIE_SUPERSET_SECRET_KEY:?GSIE_SUPERSET_SECRET_KEY requis — openssl rand -base64 42}
      # Connexion PostgreSQL GSIE configurée via l'UI, avec le compte de
      # lecture seule : postgresql://gsie_viz:<GSIE_VIZ_DB_PASSWORD>@db:5432/gsie
      FLASK_DEBUG: "false"
      SUPERSET_LOAD_EXAMPLES: "false"
    volumes:
      - gsie_superset_data:/app/superset_home
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G

  # ──────────────────────────────────────────────────────────────────────
  # Dekart — Backend Kepler.gl (carto web self-hosted, connecteur PostGIS)
  # Port 8089
  # ──────────────────────────────────────────────────────────────────────
  dekart:
    image: dekartxyz/dekart:latest
    container_name: gsie-dekart
    profiles: ["viz"]
    ports:
      - "127.0.0.1:8089:8080"
    environment:
      # Dekart sépare le stockage de métadonnées (SQLite embarqué, sans
      # licence) de la source de données (PostGIS). Les variables
      # DEKART_POSTGRES_* (DB/USER/PASSWORD/HOST/PORT) sont pour le backend
      # de métadonnées Postgres, qui exige une licence — on ne les met pas.
      #
      # La source de données PostGIS se déclare via
      # DEKART_POSTGRES_DATASOURCE_CONNECTION. Dekart y exécute du SQL
      # arbitraire : la connexion porte `gsie_viz`, à qui la migration
      # 20260801_0025 refuse tout USAGE sur les deux schémas RGPD — la
      # barrière est en base, pas dans l'outil.
      DEKART_DATASOURCE: PG
      DEKART_STORAGE: USER
      DEKART_POSTGRES_DATASOURCE_CONNECTION: postgresql://${GSIE_VIZ_DB_USER:-gsie_viz}:${GSIE_VIZ_DB_PASSWORD:?GSIE_VIZ_DB_PASSWORD requis}@${GSIE_VIZ_DB_HOST:-db}:5432/${GSIE_DB_NAME:-gsie}
      # DEKART_DISABLE_CORS a été retiré : combiné à l'absence
      # d'authentification, il permettait à n'importe quelle page web visitée
      # par l'exploitant de soumettre une requête et d'en lire le résultat.
      DEKART_CORS_ORIGIN: http://localhost:8089
    volumes:
      - gsie_dekart_data:/data
    restart: unless-stopped
    healthcheck:
      # L'image Dekart n'embarque ni curl ni wget : on teste le port TCP
      # via /dev/tcp (bash builtin) — Dekart écoute sur :8080.
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ──────────────────────────────────────────────────────────────────────
  # SchemaSpy — Générateur de documentation du schéma (HTML statique)
  # One-shot : génère la doc puis s'arrête
  # Usage : docker compose -f docker-compose.viz.yml run --rm schemaspy
  # ──────────────────────────────────────────────────────────────────────
  schemaspy:
    image: schemaspy/schemaspy:latest
    container_name: gsie-schemaspy
    profiles: ["tools"]  # Ne démarre pas avec up -d, seulement avec --profile tools
    command: >
      -t pgsql
      -host ${GSIE_VIZ_DB_HOST:-db}
      -port 5432
      -db ${GSIE_DB_NAME:-gsie}
      -u ${GSIE_DB_USER:-gsie}
      -p ${GSIE_DB_PASSWORD:?GSIE_DB_PASSWORD requis}
      -s public
      -nopages
    volumes:
      - gsie_schemaspy_output:/output
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  gsie_metabase_data:
  gsie_superset_data:
  gsie_dekart_data:
  gsie_schemaspy_output:

networks:
  default:
    name: api_default
    external: true
