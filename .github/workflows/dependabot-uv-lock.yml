# Régénère uv.lock automatiquement après qu'une PR Dependabot a modifié
# pyproject.toml. Dependabot ne supporte pas nativement `uv lock`, donc
# ce workflow se déclenche sur les PRs ouvertes par Dependabot, exécute
# `uv lock`, et commit + push le lockfile mis à jour.
#
# Sans ce workflow, chaque PR pip Dependabot échoue au CI car
# `uv lock --check` détecte que le lockfile est désynchronisé.

name: Dependabot — régénérer uv.lock

on:
  pull_request:
    paths:
      - "GSIE/API/pyproject.toml"
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  uv-lock:
    # Ne s'exécute que pour les PRs ouvertes par Dependabot
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout la PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Installer uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Régénérer uv.lock
        working-directory: GSIE/API
        run: uv lock

      - name: Commit et push le lockfile
        working-directory: GSIE/API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --cached --quiet; then
            echo "uv.lock déjà à jour — rien à faire."
          else
            git commit -m "chore(deps): régénérer uv.lock pour Dependabot"
            git push
          fi
