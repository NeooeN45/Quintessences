name: CI

on:
  # Toute branche, pas seulement main/master : le travail se fait sur des
  # branches de correction, et n'avoir aucun retour avant l'ouverture d'une
  # pull request laisse les portes qualité rouges pendant des jours.
  # `concurrency` ci-dessous annule les exécutions obsolètes, le coût reste
  # celui d'une exécution par poussée utile.
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.1

      - name: Lint markdown corpus against the migration baseline
        run: |
          find . -name '*.md' \
            -not -path './.claude/skills/*' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 markdownlint --config .markdownlint.json

      - name: Lint newly added markdown files strictly
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --name-only --diff-filter=A -z "$BASE_SHA" HEAD -- '*.md' \
              | xargs -0 -r markdownlint --config .markdownlint-strict.json
          else
            git ls-files -z '*.md' \
              | xargs -0 -r markdownlint --config .markdownlint-strict.json
          fi

  consistency-checks:
    name: Consistency Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate source-of-truth registry
        run: |
          python tools/check_source_of_truth.py
          python tools/check_governance_consistency.py
          python -m unittest discover -s tools/tests -p "test_*.py"
          python tools/check_ai_prompts.py
          python tools/check_build_consistency.py

      - name: Compile governance tools
        run: python -m compileall -q tools

      - name: Check line endings (LF only)
        run: |
          # Vérifie qu'aucun fichier texte n'a de CRLF dans le dépôt
          if grep -rlU $'\r' --include='*.md' --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' --include='*.json' . ; then
            echo "::error::CRLF line endings detected. Run 'git add --renormalize .' locally."
            exit 1
          fi

      - name: Check for trailing whitespace
        run: |
          if grep -rn '[[:space:]]$' --include='*.md' . | grep -v '.claude/skills/' ; then
            echo "::warning::Trailing whitespace detected in markdown files."
            grep -rn '[[:space:]]$' --include='*.md' . | grep -v '.claude/skills/' || true
          fi

      - name: Check LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE file is missing."
            exit 1
          fi

      - name: Check no secrets in tracked files
        run: |
          # Scan basique pour des patterns de secrets courants
          if grep -rnE '(ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{20}|AKIA[0-9A-Z]{16})' \
            --include='*.md' --include='*.py' --include='*.sh' --include='*.yml' --include='*.json' \
            . | grep -v '.git/' ; then
            echo "::error::Potential secret detected in tracked files!"
            exit 1
          fi

      - name: Check French language in documentation
        run: |
          # Vérifie que les documents GSIE principaux sont bien en français
          # (présence d'accents ou de mots-clés français)
          for f in README.md CLAUDE.md ROADMAP.md PROJECT_MEMORY.md CHANGELOG.md; do
            if [ -f "$f" ]; then
              if ! grep -qP '[àâäéèêëïîôöùûüç]' "$f" && ! grep -qi 'phase\|fondateur\|constitution' "$f"; then
                echo "::warning::$f might not be in French."
              fi
            fi
          done

      - name: Check constitution articles status
        run: |
          # Vérifie qu'aucun article constitutionnel n'est en statut "Draft"
          # après la clôture de la Phase 1
          for f in 00_CONSTITUTION/GSIE-CON-0*.md; do
            if [ -f "$f" ]; then
              if grep -qi 'statut.*draft\|statut.*à valider' "$f"; then
                echo "::warning::$f still in Draft/À valider status."
              fi
            fi
          done

  python-quality:
    name: Python lint + type + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GSIE/API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Lint with Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type check with mypy
        run: uv run mypy src --strict

      # Porte OpenAPI : régénère la spec et vérifie qu'elle n'a pas dérivé
      # par rapport à docs/openapi.json commité. Une spec périmée documente
      # une API qui n'existe plus — pire qu'absente (audit 2026-08-02, 3ᵉ passe).
      - name: Check OpenAPI spec is up to date
        run: |
          uv run python scripts/extract_openapi.py
          if ! git diff --quiet docs/openapi.json; then
            echo "::error::docs/openapi.json a dérivé — régénérez-le avec :"
            echo "::error::  uv run python scripts/extract_openapi.py"
            git diff --stat docs/openapi.json
            exit 1
          fi

      - name: Test with pytest
        run: uv run pytest tests/unit --cov=gsie_api --cov-report=term-missing --cov-fail-under=80

  # Le harnais de mutation est séparé du job python-quality pour paralléliser :
  # il lance 67 mutations en subprocess, chacune exécutant un sous-ensemble de
  # tests unitaires. En job séparé, il tourne en parallèle de l'intégration et
  # du build Docker, réduisant le temps total de CI de ~33 min à ~10 min.
  python-mutation:
    name: Python mutation harness
    runs-on: ubuntu-latest
    needs: [python-quality]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GSIE/API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      # La couverture dit quelles lignes ont tourné, jamais si un comportement
      # faux aurait été détecté. Le harnais casse volontairement chaque garde
      # issue d'un défaut constaté et exige que la suite proteste. En mode
      # rapide il ne joue que les mutations couvertes par des tests unitaires ;
      # les autres sont vérifiées par le job d'intégration.
      - name: Mutation harness (les tests mordent-ils ?)
        run: uv run python tests/mutation/harnais.py

  python-integration:
    name: Python integration tests (PostGIS + Redis)
    runs-on: ubuntu-latest
    needs: [python-quality]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: GSIE/API
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Build PostgreSQL 16 + PostGIS + AGE test image
        run: docker build --file Dockerfile.db --tag gsie-db:supply-chain-hardened .

      - name: Run integration tests (testcontainers — Docker requis)
        run: uv run pytest tests/integration -q --tb=short -v
        env:
          # testcontainers utilise le socket Docker de l'hôte (déjà disponible sur ubuntu-latest)
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GSIE_REQUIRE_MIGRATION_IMAGE: "true"

  rust-quality:
    name: Rust clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GSIE/ENGINES/EVIDENCE_ENGINE/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: GSIE/ENGINES/EVIDENCE_ENGINE/rust

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python-quality, rust-quality]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: docker build -f GSIE/API/Dockerfile --tag gsie-api:ci .

  security-scan:
    name: Scan de sécurité (Trivy)
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # L'image n'est pas publiée sur ghcr.io pendant la CI (pas de push) :
      # on la reconstruit localement sous le nom cible pour la scanner. Si
      # la construction échoue, on scanne le filesystem du dépôt à la place.
      - name: Build image cible pour le scan
        id: build_image
        continue-on-error: true
        run: |
          docker build -f GSIE/API/Dockerfile --tag ghcr.io/neooen45/gsie-api:latest .

      - name: Scan Trivy — image Docker
        if: steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/neooen45/gsie-api:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan Trivy — image Docker (SARIF)
        if: steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/neooen45/gsie-api:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan Trivy — filesystem du dépôt (repli)
        if: steps.build_image.outcome != 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan Trivy — filesystem du dépôt (SARIF, repli)
        if: steps.build_image.outcome != 'success'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload résultats SARIF vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Échec CI si vulnérabilité CRITICAL détectée
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: ${{ steps.build_image.outcome == 'success' && 'image' || 'fs' }}
          image-ref: ${{ steps.build_image.outcome == 'success' && 'ghcr.io/neooen45/gsie-api:latest' || '' }}
          scan-ref: ${{ steps.build_image.outcome == 'success' && '' || '.' }}
          format: table
          severity: CRITICAL
          exit-code: "1"
          # ignore-unfixed : ne fail que sur les CRITICAL ayant un fix disponible.
          # Les CVE Perl/Storable dans bookworm (CVE-2026-8376, CVE-2026-57433)
          # n'ont pas de fix dans bookworm — les ignorer évite de bloquer la CI
          # sur des vulnérabilités qu'on ne peut pas résoudre sans changer de
          # distribution de base. Voir .trivyignore pour les justifications.
          ignore-unfixed: true

  python-sast:
    name: Analyse SAST Python (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.12"

      - name: Installer Bandit
        run: pip install bandit==1.7.10

      # Les avertissements Bandit ne font pas échouer la CI (rapport SARIF
      # informatif uniquement) ; B101 (assert) est ignoré car les tests
      # utilisent `assert` de façon légitime.
      - name: Analyse Bandit (SARIF)
        run: |
          bandit -r GSIE/API/src/gsie_api/ -f sarif -o bandit-results.sarif --skip B101 || true
          # Garantit un SARIF valide même si bandit crashe (ex: import error).
          # GitHub requiert au moins 1 run — un SARIF vide (0 runs) est rejeté.
          if [ ! -f bandit-results.sarif ] || [ ! -s bandit-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","informationUri":"https://github.com/PyCQA/bandit"}},"results":[]}]}' > bandit-results.sarif
          fi

      - name: Upload résultats SARIF vers GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif

  governance-check:
    name: Governance Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check no Locked documents modified without RFC
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          LOCKED_FILES=(
            "00_CONSTITUTION/GSIE-FND-001.md"
            "00_CONSTITUTION/GSIE-FND-002.md"
            "00_CONSTITUTION/GSIE-CON-000.md"
          )
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BASE_SHA^{commit}"; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" HEAD)"
            if printf '%s\n' "$CHANGED_FILES" \
              | grep -Fxq -f <(printf '%s\n' "${LOCKED_FILES[@]}"); then
              if ! printf '%s\n' "$CHANGED_FILES" | grep -qE '^02_RFC/RFC-.*\.md$'; then
                echo "::error::Un document Locked a changé sans RFC associé."
                exit 1
              fi
            fi
          fi

          for f in "${LOCKED_FILES[@]}"; do
            if [ -f "$f" ]; then
              if ! head -10 "$f" | grep -qi 'locked'; then
                echo "::error::$f doit porter le statut Locked dans son en-tête."
                exit 1
              fi
            fi
          done

      - name: Check DEC files have required fields
        run: |
          for f in 03_DECISIONS/DEC-*.md; do
            if [ -f "$f" ]; then
              if ! grep -qi '\*\*ID\*\*' "$f"; then
                echo "::error::$f missing required ID field."
                exit 1
              fi
              if ! grep -qi '\*\*Statut\*\*' "$f"; then
                echo "::error::$f missing required Statut field."
                exit 1
              fi
              if ! grep -qiE '\*\*Décideur(s)?\*\*' "$f"; then
                echo "::error::$f missing required Décideur/Décideurs field."
                exit 1
              fi
            fi
          done

  # Job gate — bloque les merges si un job obligatoire échoue
  ci-gate:
    name: CI Gate (bloque merge)
    runs-on: ubuntu-latest
    needs: [markdown-lint, consistency-checks, python-quality, python-mutation, python-integration, rust-quality, docker-build, governance-check]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Vérifier que tous les jobs obligatoires ont réussi
        run: |
          echo "Jobs status:"
          echo "  markdown-lint: ${{ needs.markdown-lint.result }}"
          echo "  consistency-checks: ${{ needs.consistency-checks.result }}"
          echo "  python-quality: ${{ needs.python-quality.result }}"
          echo "  python-mutation: ${{ needs.python-mutation.result }}"
          echo "  python-integration: ${{ needs.python-integration.result }}"
          echo "  rust-quality: ${{ needs.rust-quality.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          echo "  governance-check: ${{ needs.governance-check.result }}"
          if [[ "${{ needs.markdown-lint.result }}" != "success" || \
                "${{ needs.consistency-checks.result }}" != "success" || \
                "${{ needs.python-quality.result }}" != "success" || \
                "${{ needs.python-mutation.result }}" != "success" || \
                "${{ needs.python-integration.result }}" != "success" || \
                "${{ needs.rust-quality.result }}" != "success" || \
                "${{ needs.docker-build.result }}" != "success" || \
                "${{ needs.governance-check.result }}" != "success" ]]; then
            echo "::error::Un ou plusieurs jobs CI ont échoué — merge bloqué."
            exit 1
          fi
          echo "Tous les jobs CI ont réussi — merge autorisé."
