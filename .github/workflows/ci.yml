name: CI

on:
  # La pull request est le déclencheur canonique. Un déclencheur push en
  # parallèle crée deux jeux de checks sur le même SHA ; l'annulation d'un
  # des deux est ensuite interprétée comme un échec par la porte de merge.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Une nouvelle mise à jour de la PR remplace son exécution précédente.
  group: ci-${{ github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.2"

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.49.1

      - name: Lint markdown corpus against the migration baseline
        run: |
          find . -name '*.md' \
            -not -path './.claude/skills/*' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -print0 | xargs -0 markdownlint --config .markdownlint.json

      - name: Lint newly added markdown files strictly
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BASE_SHA^{commit}"; then
            git diff --name-only --diff-filter=A -z "$BASE_SHA" HEAD -- '*.md' \
              | xargs -0 -r markdownlint --config .markdownlint-strict.json
          else
            git ls-files -z '*.md' \
              | xargs -0 -r markdownlint --config .markdownlint-strict.json
          fi

  consistency-checks:
    name: Consistency Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate source-of-truth registry
        run: |
          python tools/check_source_of_truth.py
          python tools/check_governance_consistency.py
          python -m unittest discover -s tools/tests -p "test_*.py"
          python tools/check_ai_prompts.py
          python tools/check_build_consistency.py
          python GSIE/API/scripts/audit_engines.py --root GSIE/API

      - name: Compile governance tools
        run: python -m compileall -q tools

      - name: Check line endings (LF only)
        run: |
          # Vérifie qu'aucun fichier texte n'a de CRLF dans le dépôt
          if grep -rlU $'\r' --include='*.md' --include='*.py' --include='*.sh' --include='*.yml' --include='*.yaml' --include='*.json' . ; then
            echo "::error::CRLF line endings detected. Run 'git add --renormalize .' locally."
            exit 1
          fi

      - name: Check for trailing whitespace
        run: |
          if grep -rn '[[:space:]]$' --include='*.md' . | grep -v '.claude/skills/' ; then
            echo "::warning::Trailing whitespace detected in markdown files."
            grep -rn '[[:space:]]$' --include='*.md' . | grep -v '.claude/skills/' || true
          fi

      - name: Check LICENSE exists
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::LICENSE file is missing."
            exit 1
          fi

      - name: Check no secrets in tracked files
        run: |
          # Scan basique pour des patterns de secrets courants
          if grep -rnE '(ghp_[a-zA-Z0-9]{36}|gho_[a-zA-Z0-9]{36}|sk-[a-zA-Z0-9]{20}|AKIA[0-9A-Z]{16})' \
            --include='*.md' --include='*.py' --include='*.sh' --include='*.yml' --include='*.json' \
            . | grep -v '.git/' ; then
            echo "::error::Potential secret detected in tracked files!"
            exit 1
          fi

      - name: Vérifier le cloisonnement des environnements de données
        run: |
          python GSIE/API/scripts/verify_data_environment.py \
            --environment development \
            --database-role test \
            --namespace gsie-test \
            --database-url postgresql+asyncpg://gsie_api:ci@localhost:5432/gsie_test \
            --object-bucket gsie-assets-test \
            --compose-project gsie-test
          if python GSIE/API/scripts/verify_data_environment.py \
            --environment production \
            --database-role production \
            --namespace gsie-staging \
            --database-url postgresql+asyncpg://gsie_api:ci@db:5432/gsie_production \
            --object-bucket gsie-assets-production \
            --compose-project gsie-production; then
            echo "::error::Le garde-fou a accepté un namespace de staging en production."
            exit 1
          fi

      - name: Check French language in documentation
        run: |
          # Vérifie que les documents GSIE principaux sont bien en français
          # (présence d'accents ou de mots-clés français)
          for f in README.md CLAUDE.md ROADMAP.md PROJECT_MEMORY.md CHANGELOG.md; do
            if [ -f "$f" ]; then
              if ! grep -qP '[àâäéèêëïîôöùûüç]' "$f" && ! grep -qi 'phase\|fondateur\|constitution' "$f"; then
                echo "::warning::$f might not be in French."
              fi
            fi
          done

      - name: Check constitution articles status
        run: |
          # Vérifie qu'aucun article constitutionnel n'est en statut "Draft"
          # après la clôture de la Phase 1
          for f in 00_CONSTITUTION/GSIE-CON-0*.md; do
            if [ -f "$f" ]; then
              if grep -qi 'statut.*draft\|statut.*à valider' "$f"; then
                echo "::warning::$f still in Draft/À valider status."
              fi
            fi
          done

  python-quality:
    name: Python lint + type + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GSIE/API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          uv lock --check
          uv sync --locked --extra dev

      - name: Lint with Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type check with mypy
        run: uv run mypy src --strict

      # Porte OpenAPI : régénère la spec et vérifie qu'elle n'a pas dérivé
      # par rapport à docs/openapi.json commité. Une spec périmée documente
      # une API qui n'existe plus — pire qu'absente (audit 2026-08-02, 3ᵉ passe).
      - name: Check OpenAPI spec is up to date
        run: |
          uv run python scripts/extract_openapi.py
          if ! git diff --quiet docs/openapi.json; then
            echo "::error::docs/openapi.json a dérivé — régénérez-le avec :"
            echo "::error::  uv run python scripts/extract_openapi.py"
            git diff --stat docs/openapi.json
            git diff docs/openapi.json | head -300
            exit 1
          fi

      # Tests JWT RS256 — certaines suites ont besoin de clés localement.
      # En CI, elles ne sont pas versionnées ; on les génère à la volée.
      - name: Generate JWT keys for tests
        run: |
          if [ ! -f keys/private.pem ]; then
            sh docker/generate-jwt-keys.sh
          fi

      - name: Test with pytest
        env:
          COVERAGE_FILE: tests/perf/results/.coverage.unit
        run: |
          mkdir -p tests/perf/results
          uv run pytest tests/unit --cov=gsie_api \
            --cov-report=term-missing \
            --cov-report=json:tests/perf/results/coverage-unit.json \
            --cov-fail-under=0

      - name: Publier la couverture unitaire
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-unit-coverage
          path: |
            GSIE/API/tests/perf/results/.coverage.unit
            GSIE/API/tests/perf/results/coverage-unit.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # Le harnais de mutation est séparé du job python-quality pour paralléliser :
  # il lance 67 mutations en subprocess, chacune exécutant un sous-ensemble de
  # tests unitaires. En job séparé, il tourne en parallèle de l'intégration et
  # du build Docker, réduisant le temps total de CI de ~33 min à ~10 min.
  python-mutation:
    name: Python mutation harness
    runs-on: ubuntu-latest
    needs: [python-quality]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GSIE/API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      # JWT RS256 — requis par les tests unitaires quand le harnais les lance.
      - name: Generate JWT keys for tests
        run: |
          if [ ! -f keys/private.pem ]; then
            sh docker/generate-jwt-keys.sh
          fi

      # La couverture dit quelles lignes ont tourné, jamais si un comportement
      # faux aurait été détecté. Le harnais casse volontairement chaque garde
      # issue d'un défaut constaté et exige que la suite proteste. En mode
      # rapide il ne joue que les mutations couvertes par des tests unitaires ;
      # les autres sont vérifiées par le job d'intégration.
      - name: Mutation harness (les tests mordent-ils ?)
        run: uv run python tests/mutation/harnais.py

  python-integration:
    name: Python integration tests (PostGIS + Redis)
    runs-on: ubuntu-latest
    needs: [python-quality]
    timeout-minutes: 40
    defaults:
      run:
        working-directory: GSIE/API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Build PostgreSQL 16 + PostGIS + AGE test image
        run: docker build --file Dockerfile.db --tag gsie-db:supply-chain-hardened .

      # JWT RS256 — requis par les tests E2E qui signent des tokens.
      - name: Generate JWT keys for tests
        run: |
          if [ ! -f keys/private.pem ]; then
            sh docker/generate-jwt-keys.sh
          fi

      - name: Run integration tests (testcontainers — Docker requis)
        # La campagne conserve sa mesure propre puis le job python-coverage
        # l'unit à la mesure unitaire. Son succès fonctionnel ne dépend pas du
        # pourcentage isolé : la politique est appliquée au rapport combiné.
        run: |
          mkdir -p tests/perf/results
          uv run pytest tests/integration -q --tb=short -v \
            --cov=gsie_api \
            --cov-report=term-missing \
            --cov-report=json:tests/perf/results/coverage-integration.json \
            --cov-fail-under=0
        env:
          COVERAGE_FILE: tests/perf/results/.coverage.integration
          # testcontainers utilise le socket Docker de l'hôte (déjà disponible sur ubuntu-latest)
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GSIE_REQUIRE_MIGRATION_IMAGE: "true"

      - name: Publier la couverture d'intégration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-integration-coverage
          path: |
            GSIE/API/tests/perf/results/.coverage.integration
            GSIE/API/tests/perf/results/coverage-integration.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  python-coverage:
    name: Python couverture combinée
    runs-on: ubuntu-latest
    needs: [python-quality, python-integration]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: GSIE/API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Télécharger la couverture unitaire
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-unit-coverage
          path: GSIE/API/tests/perf/results/coverage-input

      - name: Télécharger la couverture d'intégration
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-integration-coverage
          path: GSIE/API/tests/perf/results/coverage-input

      - name: Fusionner et vérifier la politique multicouche
        run: |
          uv run coverage combine tests/perf/results/coverage-input
          uv run coverage report --show-missing
          uv run coverage json -o tests/perf/results/coverage-combined.json
          uv run python scripts/check_coverage_policy.py \
            --report tests/perf/results/coverage-combined.json

      - name: Publier le rapport combiné
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-combined-coverage
          path: GSIE/API/tests/perf/results/coverage-combined.json
          if-no-files-found: warn
          retention-days: 14

  data-registry-validation:
    name: Data Registry (PostgreSQL + MinIO)
    runs-on: ubuntu-latest
    needs: [python-quality]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: GSIE/API
    env:
      GSIE_DATABASE_URL: postgresql+asyncpg://gsie:gsie_ci_registry@127.0.0.1:55432/gsie
      GSIE_MIGRATION_DATABASE_URL: postgresql+asyncpg://gsie:gsie_ci_registry@127.0.0.1:55432/gsie
      GSIE_DB_SSL_MODE: disable
      GSIE_OBJECT_STORAGE_BACKEND: s3
      GSIE_OBJECT_STORAGE_S3_ENDPOINT: http://127.0.0.1:59000
      GSIE_OBJECT_STORAGE_S3_ACCESS_KEY: gsie-registry-ci
      GSIE_OBJECT_STORAGE_S3_SECRET_KEY: gsie-registry-ci-secret
      GSIE_OBJECT_STORAGE_S3_BUCKET: gsie-registry-ci
      TESTCONTAINERS_RYUK_DISABLED: "true"
      GSIE_REQUIRE_MIGRATION_IMAGE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      # Le vérificateur rejoue aussi les tests d'infrastructure qui signent
      # un jeton WebSocket. Les clés de test ne sont jamais versionnées.
      - name: Generate JWT keys for registry validation
        run: |
          if [ ! -f keys/private.pem ]; then
            sh docker/generate-jwt-keys.sh
          fi

      - name: Build PostgreSQL 16 + PostGIS + AGE image
        run: docker build --file Dockerfile.db --tag gsie-db:supply-chain-hardened .

      - name: Start disposable PostgreSQL and MinIO
        run: |
          docker run --detach --name gsie-registry-db \
            --publish 127.0.0.1:55432:5432 \
            --env POSTGRES_USER=gsie \
            --env POSTGRES_PASSWORD=gsie_ci_registry \
            --env POSTGRES_DB=gsie \
            --env GSIE_API_DB_USER=gsie_api \
            --env GSIE_API_DB_PASSWORD=gsie_api_ci_registry \
            --env GSIE_VIZ_DB_USER=gsie_viz \
            --env GSIE_VIZ_DB_PASSWORD=gsie_viz_ci_registry \
            --volume "$PWD/docker/init:/docker-entrypoint-initdb.d:ro" \
            --volume "$PWD/docker/comptes-de-connexion.sql:/gsie/comptes-de-connexion.sql:ro" \
            gsie-db:supply-chain-hardened
          docker run --detach --name gsie-registry-minio \
            --publish 127.0.0.1:59000:9000 \
            --env MINIO_ROOT_USER=gsie-registry-ci \
            --env MINIO_ROOT_PASSWORD=gsie-registry-ci-secret \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for attempt in $(seq 1 60); do
            docker exec gsie-registry-db pg_isready -U gsie -d gsie && break
            test "$attempt" -lt 60 || exit 1
            sleep 2
          done
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:59000/minio/health/ready && break
            test "$attempt" -lt 60 || exit 1
            sleep 2
          done
          docker run --rm --network host --entrypoint /bin/sh \
            --env MC_CONFIG_DIR=/tmp/mc \
            minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c 'mc alias set ci http://127.0.0.1:59000 gsie-registry-ci gsie-registry-ci-secret && mc mb --ignore-existing ci/gsie-registry-ci'

      - name: Apply migrations to the disposable database
        run: uv run alembic upgrade head

      - name: Reproduce the three validation campaigns
        run: uv run python scripts/validate_data_registry_release.py --output artifacts/data-registry-validation.json

      - name: Smoke manifest, idempotency and MinIO round-trip
        run: |
          uv run python scripts/smoke_data_registry_infrastructure.py \
            --output artifacts/data-registry-infrastructure-smoke.json

      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-registry-validation
          path: GSIE/API/artifacts/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Stop disposable infrastructure
        if: always()
        run: |
          docker rm --force gsie-registry-db gsie-registry-minio || true

  rust-quality:
    name: Rust clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: GSIE/ENGINES/EVIDENCE_ENGINE/rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@8641a17e25bf5b40c118d48fe0f81e8655731839 # 1.85.0
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: GSIE/ENGINES/EVIDENCE_ENGINE/rust

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python-quality, rust-quality]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        run: docker build -f GSIE/API/Dockerfile --tag gsie-api:ci .

  security-scan:
    name: Scan de sécurité (Trivy)
    runs-on: ubuntu-latest
    needs: [docker-build]
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # L'image n'est pas publiée sur ghcr.io pendant la CI (pas de push) :
      # on la reconstruit localement sous le nom cible pour la scanner. Si
      # la construction échoue, on scanne le filesystem du dépôt à la place.
      - name: Build image cible pour le scan
        id: build_image
        continue-on-error: true
        run: |
          docker build -f GSIE/API/Dockerfile --tag ghcr.io/neooen45/gsie-api:latest .

      - name: Scan Trivy — image Docker
        if: steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/neooen45/gsie-api:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan Trivy — image Docker (SARIF)
        if: steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/neooen45/gsie-api:latest
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan Trivy — filesystem du dépôt (repli)
        if: steps.build_image.outcome != 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Scan Trivy — filesystem du dépôt (SARIF, repli)
        if: steps.build_image.outcome != 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload résultats SARIF vers GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: trivy-results.sarif

      - name: Échec CI si vulnérabilité HIGH ou CRITICAL corrigible détectée
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ steps.build_image.outcome == 'success' && 'image' || 'fs' }}
          image-ref: ${{ steps.build_image.outcome == 'success' && 'ghcr.io/neooen45/gsie-api:latest' || '' }}
          scan-ref: ${{ steps.build_image.outcome == 'success' && '' || '.' }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          # ignore-unfixed : ne bloque que sur les HIGH/CRITICAL ayant un correctif.
          # Les CVE Perl/Storable dans bookworm (CVE-2026-8376, CVE-2026-57433)
          # n'ont pas de fix dans bookworm — les ignorer évite de bloquer la CI
          # sur des vulnérabilités qu'on ne peut pas résoudre sans changer de
          # distribution de base. Voir .trivyignore pour les justifications.
          ignore-unfixed: true

  python-sast:
    name: Analyse SAST Python (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.12"

      - name: Installer Bandit
        run: pip install bandit==1.7.10

      # Le rapport SARIF reste produit même si Bandit détecte une anomalie ; le gate
      # bloquant ci-dessous tranche ensuite. B101 (assert) est ignoré car les tests
      # utilisent `assert` de façon légitime.
      - name: Analyse Bandit (SARIF)
        run: |
          bandit -r GSIE/API/src/gsie_api/ -f sarif -o bandit-results.sarif --skip B101 || true
          # Garantit un SARIF valide même si bandit crashe (ex: import error).
          # GitHub requiert au moins 1 run — un SARIF vide (0 runs) est rejeté.
          if [ ! -f bandit-results.sarif ] || [ ! -s bandit-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","informationUri":"https://github.com/PyCQA/bandit"}},"results":[]}]}' > bandit-results.sarif
          fi

      - name: Bloquer les vulnérabilités Bandit moyennes et hautes
        run: bandit -r GSIE/API/src/gsie_api/ --severity-level medium --confidence-level medium --skip B101

      - name: Upload résultats SARIF vers GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.4
        with:
          sarif_file: bandit-results.sarif

  governance-check:
    name: Governance Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check no Locked documents modified without RFC
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          LOCKED_FILES=(
            "00_CONSTITUTION/GSIE-FND-001.md"
            "00_CONSTITUTION/GSIE-FND-002.md"
            "00_CONSTITUTION/GSIE-CON-000.md"
          )
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]] \
            && git cat-file -e "$BASE_SHA^{commit}"; then
            CHANGED_FILES="$(git diff --name-only "$BASE_SHA" HEAD)"
            for locked_file in "${LOCKED_FILES[@]}"; do
              if ! printf '%s\n' "$CHANGED_FILES" | grep -Fxq "$locked_file"; then
                continue
              fi

              ASSOCIATED_RFC=""
              while IFS= read -r rfc; do
                if grep -qiE 'Statut.*(Adopté|Adopte|Validated|Validé)' "$rfc" \
                  && grep -Fq "$locked_file" "$rfc"; then
                  ASSOCIATED_RFC="$rfc"
                  break
                fi
              done < <(printf '%s\n' "$CHANGED_FILES" | grep -E '^02_RFC/RFC-.*\.md$' || true)

              if [[ -z "$ASSOCIATED_RFC" ]]; then
                echo "::error::$locked_file a changé sans RFC adoptée qui le référence explicitement."
                exit 1
              fi
            done
          fi

          for f in "${LOCKED_FILES[@]}"; do
            if [ -f "$f" ]; then
              if ! head -10 "$f" | grep -qi 'locked'; then
                echo "::error::$f doit porter le statut Locked dans son en-tête."
                exit 1
              fi
            fi
          done

      - name: Check DEC files have required fields
        run: |
          for f in 03_DECISIONS/DEC-*.md; do
            if [ -f "$f" ]; then
              if ! grep -qi '\*\*ID\*\*' "$f"; then
                echo "::error::$f missing required ID field."
                exit 1
              fi
              if ! grep -qi '\*\*Statut\*\*' "$f"; then
                echo "::error::$f missing required Statut field."
                exit 1
              fi
              if ! grep -qiE '\*\*Décideur(s)?\*\*' "$f"; then
                echo "::error::$f missing required Décideur/Décideurs field."
                exit 1
              fi
            fi
          done

  # Job gate — bloque les merges si un job obligatoire échoue
  ci-gate:
    name: CI Gate (bloque merge)
    runs-on: ubuntu-latest
    needs: [markdown-lint, consistency-checks, python-quality, python-mutation, python-integration, python-coverage, data-registry-validation, rust-quality, docker-build, security-scan, python-sast, governance-check]
    timeout-minutes: 5
    if: always()
    steps:
      - name: Vérifier que tous les jobs obligatoires ont réussi
        run: |
          echo "Jobs status:"
          echo "  markdown-lint: ${{ needs.markdown-lint.result }}"
          echo "  consistency-checks: ${{ needs.consistency-checks.result }}"
          echo "  python-quality: ${{ needs.python-quality.result }}"
          echo "  python-mutation: ${{ needs.python-mutation.result }}"
          echo "  python-integration: ${{ needs.python-integration.result }}"
          echo "  python-coverage: ${{ needs.python-coverage.result }}"
          echo "  data-registry-validation: ${{ needs.data-registry-validation.result }}"
          echo "  rust-quality: ${{ needs.rust-quality.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"
          echo "  security-scan: ${{ needs.security-scan.result }}"
          echo "  python-sast: ${{ needs.python-sast.result }}"
          echo "  governance-check: ${{ needs.governance-check.result }}"
          if [[ "${{ needs.markdown-lint.result }}" != "success" || \
                "${{ needs.consistency-checks.result }}" != "success" || \
                "${{ needs.python-quality.result }}" != "success" || \
                "${{ needs.python-mutation.result }}" != "success" || \
                "${{ needs.python-integration.result }}" != "success" || \
                "${{ needs.python-coverage.result }}" != "success" || \
                "${{ needs.data-registry-validation.result }}" != "success" || \
                "${{ needs.rust-quality.result }}" != "success" || \
                "${{ needs.docker-build.result }}" != "success" || \
                "${{ needs.security-scan.result }}" != "success" || \
                "${{ needs.python-sast.result }}" != "success" || \
                "${{ needs.governance-check.result }}" != "success" ]]; then
            echo "::error::Un ou plusieurs jobs CI ont échoué — merge bloqué."
            exit 1
          fi
          echo "Tous les jobs CI ont réussi — merge autorisé."
