name: Ruff format diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ruff-format-diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GSIE/API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Show Ruff formatter diff
        run: uv run ruff format --diff tests/integration/test_resource_scope_runtime_rls.py
