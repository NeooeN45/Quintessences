# Dependabot — mises à jour de sécurité et de versions automatiques.
# Veille technologique 2026-08-02 : quick win Phase 1.
# Documentation : https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Dépendances Python (API GSIE)
  - package-ecosystem: "pip"
    directory: "/GSIE/API"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "NeooeN45"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Grouper les paquets opentelemetry pour éviter les PRs incompatibles
    # (instrumentation 0.65b0 exige sdk 1.44.0 — bump coordonné obligatoire)
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-api"
          - "opentelemetry-sdk"
          - "opentelemetry-exporter-otlp-proto-grpc"
          - "opentelemetry-instrumentation-fastapi"
          - "opentelemetry-instrumentation-sqlalchemy"
          - "opentelemetry-instrumentation-redis"
    # eccodeslib doit partager la version majeure.mineure d'eccodes
    # (règle check_build_consistency.py). eccodes 2.48.0 n'existe pas
    # sur PyPI — ignorer eccodeslib > 2.47.x jusqu'à publication d'eccodes 2.48.
    ignore:
      - dependency-name: "eccodeslib"
        update-types: ["version-update:semver-minor"]

  # Images Docker de base
  - package-ecosystem: "docker"
    directory: "/GSIE/API"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    reviewers:
      - "NeooeN45"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "NeooeN45"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
